[defaults]
inventory = inventory/hosts.ini
roles_path = roles
host_key_checking = False
retry_files_enabled = False
interpreter_python = auto_silent
# ansible-core >= 2.13: the community.general "yaml" callback was removed in
# community.general 12, so the equivalent output is produced by the built-in
# default callback with a YAML result format.
stdout_callback = ansible.builtin.default
callback_result_format = yaml
