spring:
  datasource:
    url: jdbc:h2:mem:certmonitor-test;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
  thymeleaf:
    cache: false

app:
  warning-threshold-days: 30
  demo-data:
    enabled: false

logging:
  level:
    root: WARN
    com.example.certmonitor: INFO
