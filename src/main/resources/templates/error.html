<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Error')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>

<main id="main" class="container py-5">
    <div class="row justify-content-center">
        <div class="col-lg-7">
            <div class="card text-center">
                <div class="card-body p-5">
                    <p class="display-5 fw-bold mb-2" th:text="${status != null ? status : 500}"
                       data-testid="error-status">404</p>
                    <h1 class="h3 mb-2" th:text="${error != null ? error : 'Something went wrong'}"
                        data-testid="error-title">Not found</h1>
                    <p class="text-muted mb-1" th:text="${message != null ? message : 'The request could not be completed.'}">
                        The requested resource could not be found.
                    </p>
                    <p class="text-muted small" th:if="${path != null}" th:text="|Requested path: ${path}|">
                        Requested path: /certificates/99
                    </p>
                    <div class="d-flex justify-content-center gap-2 mt-4">
                        <a class="btn btn-primary" th:href="@{/}">Back to dashboard</a>
                        <a class="btn btn-outline-secondary" th:href="@{/certificates}">View certificates</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
<div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
