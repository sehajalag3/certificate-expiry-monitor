spring:
  application:
    name: certificate-expiry-monitor
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:h2:file:./data/certificate-monitor;AUTO_SERVER=TRUE}
    username: ${SPRING_DATASOURCE_USERNAME:sa}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    driver-class-name: ${SPRING_DATASOURCE_DRIVER_CLASS_NAME:org.h2.Driver}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
  thymeleaf:
    cache: ${THYMELEAF_CACHE:false}
  h2:
    console:
      enabled: ${H2_CONSOLE_ENABLED:false}
      path: /h2-console
  web:
    resources:
      cache:
        period: 3600

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful
  error:
    include-message: never
    include-stacktrace: never
    whitelabel:
      enabled: false

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
  info:
    env:
      enabled: true

info:
  app:
    name: Certificate Expiry Monitor
    version: 1.0.0
    description: Certificate expiry tracking and alerting dashboard

app:
  warning-threshold-days: ${WARNING_THRESHOLD_DAYS:30}
  demo-data:
    enabled: ${DEMO_DATA_ENABLED:true}

logging:
  level:
    root: INFO
    com.example.certmonitor: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%thread] %logger{36} - %msg%n"
